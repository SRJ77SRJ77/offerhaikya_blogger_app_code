name: Deploy OfferHaikya Firestore Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:

jobs:
  validate-app-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate App.tsx syntax
        run: npx --yes esbuild App.tsx --outfile=/tmp/OfferhaikyaApp.js

  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules (Spark-plan compatible)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --project offerhaikya-app --token "$FIREBASE_TOKEN"
