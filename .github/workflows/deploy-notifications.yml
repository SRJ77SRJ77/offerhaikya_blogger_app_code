name: Deploy OfferHaikya Notifications

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions (requires Firebase Blaze plan)'
        required: true
        type: boolean
        default: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules (Spark-plan compatible)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --project offerhaikya-app --token "$FIREBASE_TOKEN"

  deploy-functions:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true }}
    needs: deploy-firestore-rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Deploy notification function (requires Blaze plan)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions:sendNewOfferNotifications --project offerhaikya-app --token "$FIREBASE_TOKEN"
